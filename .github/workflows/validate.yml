name: Validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y

      - name: Verify Unreal naming
        run: python Scripts/verify_ue_naming.py

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build tests and tools
        run: cmake --build build --config Release --target RendererTests LeonTournamentTests LeonAssetTool

      - name: Run unit tests
        run: python Scripts/run_tests.py

      - name: Validate project
        run: python Scripts/validate_project.py --project Projects/Sandbox/Sandbox.lproject
        env:
          LEON_BUILD_CONFIG: Release
