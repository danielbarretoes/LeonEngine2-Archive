name: Validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y

      - name: Verify Unreal naming
        run: python Scripts/verify_ue_naming.py

      - name: Configure Engine
        run: cmake -S . -B out/Engine -G Ninja -DCMAKE_BUILD_TYPE=Release -DLEON_PRODUCT=Engine

      - name: Build tests and tools
        run: cmake --build out/Engine --config Release --target RendererTests AssetTool LightmassTool ProjectTool

      - name: Run unit tests
        run: python Scripts/run_tests.py

      - name: Build and validate Sandbox
        run: |
          python Scripts/build_project.py --project Projects/Sandbox/Sandbox.lproject --config Release
          python Scripts/validate_project.py --project Projects/Sandbox/Sandbox.lproject
        env:
          LEON_BUILD_CONFIG: Release

      - name: Build LeonTournament
        run: python Scripts/build_project.py --project Projects/LeonTournament/LeonTournament.lproject --config Release
        env:
          LEON_BUILD_CONFIG: Release

  build-editor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure Editor
        run: cmake -S Editor -B out/Editor -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build LeonEditor
        run: cmake --build out/Editor --config Release --target LeonEditor
